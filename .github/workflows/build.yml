name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --legacy-peer-deps
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - name: AdMob App ID (TEST)
        env: { ADMOB_APP_ID: "${{ secrets.ADMOB_APP_ID }}" }
        run: |
          ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ID\"/></application>#" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: nuvora-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
